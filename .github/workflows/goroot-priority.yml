name: Native compatibility regression qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.7', '1.27.0']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: 75b6caa8fd872c44f6db9c4b56ec90c0fca927fb
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - name: Build with the repository Go toolchain
        shell: bash
        run: go build -tags=llvm22,dev -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Qualify original Intel cases
        shell: bash
        run: |
          export LLGO_ROOT="$PWD"
          mkdir -p "$GOPATH/src/github.com/xgo-dev"
          ln -s "$PWD" "$GOPATH/src/github.com/xgo-dev/llgo"
          export GO111MODULE=off
          python3 - <<'PYTEST'
          import os, subprocess, time
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          root = Path(subprocess.check_output(['go', 'env', 'GOROOT'], text=True).strip())
          results = []
          for name in ['inline_caller', 'inline_callers', 'abi/uglyfib']:
              stem = name.rsplit('/', 1)[-1]
              source = root / 'test' / (name + '.go')
              for compiler in [str(tmp / 'llgo'), 'go']:
                  target = tmp / (Path(compiler).name + '-' + stem)
                  subprocess.run([compiler, 'build', '-o', str(target), str(source)], check=True)
                  t = time.monotonic()
                  with (tmp / (target.name + '-stress.log')).open('w') as f:
                      try:
                          r = subprocess.run([str(target)], stdout=f, stderr=subprocess.STDOUT, timeout=60)
                          print(target.name, 'exit', r.returncode, 'seconds', round(time.monotonic()-t, 2), flush=True)
                          results.append(r.returncode == 0)
                      except subprocess.TimeoutExpired:
                          print(target.name, 'TIMEOUT after 60s', flush=True)
                          results.append(False)
                  print((tmp / (target.name + '-stress.log')).read_text(), flush=True)
          assert all(results), results
          PYTEST
      - name: Diagnose frame PCs and recursive allocation
        if: always()
        shell: bash
        run: |
          export LLGO_ROOT="$PWD"
          export GO111MODULE=off
          python3 - <<'PYPROBE'
          import os, subprocess
          from pathlib import Path
          root = Path(subprocess.check_output(['go', 'env', 'GOROOT'], text=True).strip())
          text = (root / 'test/inline_caller.go').read_text()
          text = text.replace('if fn.Name() != expected[i].funcName {', 'println("FRAME", i, frame.pc, fn.Entry(), frame.file, frame.line, fn.Name()); if fn.Name() != expected[i].funcName {')
          text = text.replace('panic(fmt.Sprintf("skip=%d expected function %s, got %s", i, expected[i].funcName, fn.Name()))', 'println(fmt.Sprintf("skip=%d expected function %s, got %s", i, expected[i].funcName, fn.Name()))')
          (Path(os.environ['RUNNER_TEMP']) / 'inline-caller-probe.go').write_text(text)
          PYPROBE
          "$RUNNER_TEMP/llgo" build -o "$RUNNER_TEMP/inline-caller-probe" "$RUNNER_TEMP/inline-caller-probe.go"
          LLGO_FUNCINFO_DEBUG=1 "$RUNNER_TEMP/inline-caller-probe" 2>&1 | tee "$RUNNER_TEMP/intel-frames-stress.log"
          llvm-objdump --disassemble-symbols=main.f,main.g,main.h,main.k "$RUNNER_TEMP/llgo-uglyfib" | tee "$RUNNER_TEMP/intel-recursion-stress.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intel-diagnosis-${{ matrix.go }}
          path: ${{ runner.temp }}/*-stress.log
