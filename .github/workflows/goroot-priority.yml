name: Native compatibility regression qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: 469e8db17feda572f64356cd2b1eff691bcedf74
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - name: Qualify recovered hardware-fault callers
        shell: bash
        run: |
          go build -tags=llvm22,dev -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          export LLGO_ROOT="$PWD"
          "$RUNNER_TEMP/llgo" build -o "$RUNNER_TEMP/bug347" "$(go env GOROOT)/test/fixedbugs/bug347.go"
          "$RUNNER_TEMP/bug347" 2>&1 | tee "$RUNNER_TEMP/fault-stress.log"
          test ! -s "$RUNNER_TEMP/fault-stress.log"
          "$RUNNER_TEMP/llgo" test ./test/std/runtime -run 'TestCaller(DuringPanic|AfterHardware)'
          "$RUNNER_TEMP/llgo" test ./test/std/sync
      - name: Compile isolated RWMutex stress programs
        shell: bash
        run: |
          export LLGO_ROOT="$PWD"
          source_file="$(go env GOROOT)/test/fixedbugs/issue79186.go"
          go build -o "$RUNNER_TEMP/go-stress" "$source_file"
          "$RUNNER_TEMP/llgo" build -o "$RUNNER_TEMP/llgo-stress" "$source_file"
      - name: Measure single-version stress with the unchanged one-minute limit
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v timeout --kill-after=5s 60s "$RUNNER_TEMP/go-stress" 2>&1 | tee "$RUNNER_TEMP/go-stress.log"
          /usr/bin/time -v timeout --kill-after=5s 60s "$RUNNER_TEMP/llgo-stress" 2>&1 | tee "$RUNNER_TEMP/llgo-stress.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-diagnosis-${{ matrix.os }}
          path: ${{ runner.temp }}/*-stress.log
