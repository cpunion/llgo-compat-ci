name: Native compatibility diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: f2337548d7f0ac134cbac0c9aaa50d3aec642d66
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - name: Inspect recovered hardware-fault frames
        shell: bash
        run: |
          go build -tags=llvm22,dev -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          export LLGO_ROOT="$PWD"
          python3 - <<'PYPROBE'
          import os, subprocess
          from pathlib import Path
          root = Path(subprocess.check_output(['go', 'env', 'GOROOT'], text=True).strip())
          source = (root / 'test/fixedbugs/bug347.go').read_text()
          source = source.replace('pc, file, line, ok := runtime.Caller(i)',
              'pc, file, line, ok := runtime.Caller(i)\n' +
              '\t\t\tprintln("CALLER", i, pc, file, line, ok)\n' +
              '\t\t\tif fn := runtime.FuncForPC(pc); fn != nil { println("FUNCTION", fn.Name()) }')
          (Path(os.environ['RUNNER_TEMP']) / 'bug347-probe.go').write_text(source)
          PYPROBE
          "$RUNNER_TEMP/llgo" build -o "$RUNNER_TEMP/bug347-probe" "$RUNNER_TEMP/bug347-probe.go"
          "$RUNNER_TEMP/bug347-probe" 2>&1 | tee "$RUNNER_TEMP/callers.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnosis-${{ matrix.os }}
          path: ${{ runner.temp }}/callers.log
