name: Development environments

on:
  pull_request:
    paths:
      - .github/workflows/devenv.yml
  workflow_dispatch:
    inputs:
      llgo_repository:
        description: LLGo repository to test
        required: true
        default: xgo-dev/llgo
        type: string
      llgo_ref:
        description: Branch, tag, or commit to test
        required: true
        default: main
        type: string
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revision:
    name: Resolve LLGo revision
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ inputs.llgo_ref || 'main' }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  mise:
    name: Mise (${{ matrix.os }})
    needs: revision
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: llgo dev
    strategy:
      fail-fast: false
      matrix:
        # Linux amd64 remains a per-change gate on LLGo's Qiniu runners.
        os: [ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ needs.revision.outputs.sha }}
          path: llgo dev
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          install_args: --locked
          working_directory: llgo dev/dev
          env: true
          export_path: true
      - name: Build LLGo and check native dependencies
        if: runner.os != 'Windows'
        run: bash dev/check_devenv.sh
      - name: Build LLGo and check native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dev\check_devenv.ps1

  pixi:
    name: Pixi (${{ matrix.os }})
    needs: revision
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: llgo dev
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ needs.revision.outputs.sha }}
          path: llgo dev
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          working-directory: llgo dev/dev
          locked: true
      - name: Check the development environment
        if: runner.os != 'Windows'
        run: pixi run --manifest-path dev/pixi.toml --locked bash dev/check_devenv.sh
      - name: Check the development environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pixi run --manifest-path dev/pixi.toml --locked pwsh -File dev/check_devenv.ps1

  summary:
    name: Development environment summary
    needs: [mise, pixi]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    env:
      MISE_RESULT: ${{ needs.mise.result }}
      PIXI_RESULT: ${{ needs.pixi.result }}
    steps:
      - name: Verify both host matrices
        run: |
          test "$MISE_RESULT" = success
          test "$PIXI_RESULT" = success
