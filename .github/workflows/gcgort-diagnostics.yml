name: Diagnose Windows MSVC gcgort hang

on:
  push:
    branches: [codex/diagnose-windows-gcgort-20261006]
    paths: [.github/workflows/gcgort-diagnostics.yml]

permissions:
  contents: read

jobs:
  goroot:
    name: GOROOT (${{ matrix.os }}${{ startsWith(matrix.os, 'windows') && format(', {0}, {1}', matrix.windows_abi, matrix.windows_arch) || '' }}, Go 1.26+1.27, shard ${{ matrix.shard-index }}/${{ matrix.shard-total }})
    timeout-minutes: 180
    outputs:
      expected-reports: ${{ steps.report-count.outputs.count }}
    env:
      GOPROXY: https://proxy.golang.org,direct
      LLGO_GOROOT_HEARTBEAT_SECONDS: "60"
      # Leave thirty minutes for setup plus timeout diagnostics and artifacts.
      LLGO_GOROOT_TEST_TIMEOUT: "150m"
      LLGO_GOROOT_VERBOSE: "1"
      LLGO_GOROOT_SHARD_TOTAL: ${{ matrix.shard-total }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            windows_abi: msvc
            windows_arch: amd64
            shard-index: "0"
            shard-total: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Record expected matrix reports
        id: report-count
        shell: bash
        env:
          MATRIX_JOB_TOTAL: ${{ strategy.job-total }}
        # Each configured job reports Go 1.26 and Go 1.27, even when it runs
        # selected subshards of a larger corpus partition.
        run: echo "count=$((MATRIX_JOB_TOTAL * 2))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: e65db962b6d25ad12349caa1734b042108ffef5d

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Set up Go for building LLGo and the runner
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}

      - name: Build LLGo and the GOROOT runner
        id: build-tools
        shell: bash
        run: |
          LLGO_BUILD_GOROOT_RUNNER=1 dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"

          build_version="$(go env GOVERSION)"
          build_version="${build_version#go}"
          echo "go-version=$build_version" >> "$GITHUB_OUTPUT"
          echo "goroot=$(go env GOROOT)" >> "$GITHUB_OUTPUT"
          echo "LLGO_BUILD_GO_VERSION=$build_version" >> "$GITHUB_ENV"

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
          fi
          runner="$RUNNER_TEMP/llgo-bin/goroot-runner${tool_suffix}"
          llgo="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The shell launches the runner, while the Go runner launches
            # llgo through the native Windows process API.
            llgo="$(cygpath -w "$llgo")"
          fi
          echo "LLGO_GOROOT_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "LLGO_TEST_LLGO=$llgo" >> "$GITHUB_ENV"

      - name: Resolve target Go versions
        id: target-go
        shell: bash
        run: |
          source dev/go_toolchain.sh
          echo "go126=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.26)" >> "$GITHUB_OUTPUT"
          echo "go127=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.27)" >> "$GITHUB_OUTPUT"

      # The toolchain module downloaded through GOTOOLCHAIN omits GOROOT/test.
      # Install the complete distribution after building LLGo and the runner,
      # so those binaries always use .go-version while the corpus can vary.
      - name: Set up target Go 1.26
        if: steps.target-go.outputs.go126 != steps.build-tools.outputs.go-version
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.go126 }}
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false

      - name: Select Go 1.26 GOROOT
        id: go126
        shell: bash
        env:
          BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
          BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
          TARGET_VERSION: ${{ steps.target-go.outputs.go126 }}
        run: |
          target_goroot="$(go env GOROOT)"
          if [[ "$TARGET_VERSION" == "$BUILD_VERSION" ]]; then
            target_goroot="$BUILD_GOROOT"
          fi
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "goroot=$target_goroot" >> "$GITHUB_OUTPUT"

      - name: Set up target Go 1.27
        if: steps.target-go.outputs.go127 != steps.build-tools.outputs.go-version
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.go127 }}
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false

      - name: Select Go 1.27 GOROOT
        id: go127
        shell: bash
        env:
          BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
          BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
          TARGET_VERSION: ${{ steps.target-go.outputs.go127 }}
        run: |
          target_goroot="$(go env GOROOT)"
          if [[ "$TARGET_VERSION" == "$BUILD_VERSION" ]]; then
            target_goroot="$BUILD_GOROOT"
          fi
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "goroot=$target_goroot" >> "$GITHUB_OUTPUT"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Show toolchain versions
        shell: bash
        env:
          GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
          GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
        run: |
          echo "LLGo build toolchain: $LLGO_BUILD_GO_VERSION"
          for target_goroot in "$GO126_GOROOT" "$GO127_GOROOT"; do
            target_go="$target_goroot/bin/go"
            if [[ "$RUNNER_OS" == Windows ]]; then
              target_go+=.exe
            fi
            "$target_go" version
          done
          go env GOPROXY GOMODCACHE
          clang --version

      - name: Verify Windows process identity regressions
        if: runner.os == 'Windows'
        shell: bash
        env:
          GOROOT: ${{ steps.build-tools.outputs.goroot }}
        run: |
          build_go="$GOROOT/bin/go.exe"
          env CGO_ENABLED=0 GOARCH="$("$build_go" env GOHOSTARCH)" "$build_go" test ./test/goroot -run '^TestWindows(ProcessTree|ProcessIdentity|ProcessTermination)|^TestRunnerEnvPreservesWindowsPath$' -count=1 -timeout=3m

      - name: Install native GDB
        uses: ./.github/actions/setup-gdb

      - name: Reproduce gcgort and capture hung thread stacks
        shell: pwsh
        env:
          GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
          GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:LLGO_STDIO_NOBUF = "1"
          Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
          $logRoot = Join-Path $env:RUNNER_TEMP "gcgort-stacks"
          New-Item -ItemType Directory -Force $logRoot | Out-Null
          $commands = Join-Path $logRoot "stacks.gdb"
          @'
          set pagination off
          set confirm off
          set debuginfod enabled off
          thread apply all bt 32
          detach
          quit
          '@ | Set-Content -Encoding ascii $commands
          $failed = $false
          foreach ($iteration in 1..6) {
            foreach ($version in @("1.26", "1.27")) {
              $targetRoot = if ($version -eq "1.26") { $env:GO126_GOROOT } else { $env:GO127_GOROOT }
              $env:GOROOT = $targetRoot
              $env:LLGO_ROOT = $env:GITHUB_WORKSPACE
              $env:GOTOOLCHAIN = "local"
              $env:GOMAXPROCS = "2"
              $env:XDG_CACHE_HOME = Join-Path $env:RUNNER_TEMP "gcgort-cache-go$version"
              $stdout = Join-Path $logRoot "go$version-iteration$iteration.stdout"
              $stderr = Join-Path $logRoot "go$version-iteration$iteration.stderr"
              $arguments = @(
                "-test.run=^TestGoRootRunCases$", "-test.count=1", "-test.timeout=10m", "-test.v",
                "-goroot", $targetRoot, "-case=^gcgort.go$", "-directive-mode", "ci",
                "-keepwork", "-progress=10s", "-shard-index=0", "-shard-total=1"
              )
              $runner = Start-Process -FilePath $env:LLGO_GOROOT_RUNNER -ArgumentList $arguments `
                -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE "test/goroot") `
                -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
              $captured = @{}
              while (-not $runner.WaitForExit(1000)) {
                foreach ($child in @(Get-Process -Name llgo.out -ErrorAction SilentlyContinue)) {
                  try {
                    $exe = $child.Path.Replace([char]92, [char]47)
                    $started = $child.StartTime.ToUniversalTime()
                    if ($exe -notmatch '/llgo-goroot-[^/]+/llgo[.]out[.]exe$') { continue }
                    if (([DateTime]::UtcNow - $started).TotalSeconds -lt 20) { continue }
                    $identity = "$($child.Id)-$($started.Ticks)"
                    if ($captured.ContainsKey($identity)) { continue }
                    $captured[$identity] = $true
                    $trace = Join-Path $logRoot "go$version-iteration$iteration-thread-$identity.txt"
                    $traceErrors = "$trace.stderr"
                    $debugger = Start-Process -FilePath $env:LLGO_GDB -NoNewWindow `
                      -ArgumentList @("--batch", "--nx", "--pid=$($child.Id)", "--command=$commands") `
                      -RedirectStandardOutput $trace -RedirectStandardError $traceErrors -PassThru
                    if (-not $debugger.WaitForExit(10000)) { $debugger.Kill() }
                    Write-Host "Captured PID $($child.Id) after twenty seconds: $trace"
                  } catch {
                    Write-Host "Stack capture unavailable for PID $($child.Id): $_"
                  }
                }
              }
              $runner.WaitForExit()
              Get-Content $stdout
              Get-Content $stderr
              if ($runner.ExitCode -ne 0) { $failed = $true }
            }
          }
          if ($failed) { throw "gcgort failed; every iteration is retained in the diagnostic artifact" }

      - name: Upload gcgort diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-gcgort-stacks
          path: ${{ runner.temp }}/gcgort-stacks
          if-no-files-found: error
          retention-days: 3
