name: Validate Windows MSVC gcgort runtime
'on':
  push:
    branches:
    - codex/verify-msvc-gcgort-20261006
permissions:
  contents: read
jobs:
  regressions:
    name: GOROOT (${{ matrix.os }}${{ startsWith(matrix.os, 'windows') && format(', {0}, {1}', matrix.windows_abi, matrix.windows_arch) || '' }}, Go 1.26+1.27, shard ${{ matrix.shard-index }}/${{ matrix.shard-total }})
    timeout-minutes: 50
    env:
      GOPROXY: https://proxy.golang.org,direct
      LLGO_GOROOT_HEARTBEAT_SECONDS: '60'
      LLGO_GOROOT_TEST_TIMEOUT: 150m
      LLGO_GOROOT_VERBOSE: '1'
      LLGO_GOROOT_SHARD_TOTAL: ${{ matrix.shard-total }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          windows_abi: msvc
          windows_arch: amd64
          shard-index: 0
          shard-total: 1
          paired-shard-index: 0
    runs-on: ${{ matrix.os }}
    steps:
    - name: Record expected matrix reports
      id: report-count
      shell: bash
      env:
        MATRIX_JOB_TOTAL: ${{ strategy.job-total }}
      run: echo "count=$((MATRIX_JOB_TOTAL * 2))" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7
      with:
        repository: cpunion/llgo
        ref: 254723f2a817ea526ef6fb3e687d5849cee33e9c
    - name: Install dependencies
      uses: ./.github/actions/setup-deps
      with:
        llvm-version: 22
        windows-abi: ${{ matrix.windows_abi }}
        windows-arch: ${{ matrix.windows_arch }}
    - name: Set up Go for building LLGo and the runner
      uses: ./.github/actions/setup-go
      with:
        architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
    - name: Build LLGo and the GOROOT runner
      id: build-tools
      shell: bash
      run: "LLGO_BUILD_GOROOT_RUNNER=1 dev/build_ci_tools.sh \"$RUNNER_TEMP/llgo-bin\"\n\nbuild_version=\"$(go env GOVERSION)\"\nbuild_version=\"${build_version#go}\"\necho \"go-version=$build_version\" >> \"$GITHUB_OUTPUT\"\necho \"goroot=$(go env GOROOT)\" >> \"$GITHUB_OUTPUT\"\necho \"LLGO_BUILD_GO_VERSION=$build_version\" >> \"$GITHUB_ENV\"\n\ntool_suffix=\nif [[ \"$RUNNER_OS\" == Windows ]]; then\n  tool_suffix=.exe\nfi\nrunner=\"$RUNNER_TEMP/llgo-bin/goroot-runner${tool_suffix}\"\nllgo=\"$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}\"\nif [[ \"$RUNNER_OS\" == Windows ]]; then\n  # The shell launches the runner, while the Go runner launches\n  # llgo through the native Windows process API.\n  llgo=\"$(cygpath -w \"$llgo\")\"\nfi\necho \"LLGO_GOROOT_RUNNER=$runner\" >> \"$GITHUB_ENV\"\necho \"LLGO_TEST_LLGO=$llgo\" >> \"$GITHUB_ENV\"\n\ngo test ./ssa ./cl -run \"Debug|ZeroSized\" -count=1\ngo test ./test/goroot -skip \"^TestGoRootRunCases$\" -count=1\n"
    - name: Resolve target Go versions
      id: target-go
      shell: bash
      run: 'source dev/go_toolchain.sh

        echo "go126=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.26)" >> "$GITHUB_OUTPUT"

        echo "go127=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.27)" >> "$GITHUB_OUTPUT"

        '
    - name: Set up target Go 1.26
      if: steps.target-go.outputs.go126 != steps.build-tools.outputs.go-version
      uses: ./.github/actions/setup-go
      with:
        go-version: ${{ steps.target-go.outputs.go126 }}
        architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
        cache: false
    - name: Select Go 1.26 GOROOT
      id: go126
      shell: bash
      env:
        BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
        BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
        TARGET_VERSION: ${{ steps.target-go.outputs.go126 }}
      run: "target_goroot=\"$(go env GOROOT)\"\nif [[ \"$TARGET_VERSION\" == \"$BUILD_VERSION\" ]]; then\n  target_goroot=\"$BUILD_GOROOT\"\nfi\nif [[ ! -d \"$target_goroot/test\" ]]; then\n  echo \"Target Go distribution does not contain GOROOT/test: $target_goroot\" >&2\n  exit 1\nfi\necho \"version=$TARGET_VERSION\" >> \"$GITHUB_OUTPUT\"\necho \"goroot=$target_goroot\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Set up target Go 1.27
      if: steps.target-go.outputs.go127 != steps.build-tools.outputs.go-version
      uses: ./.github/actions/setup-go
      with:
        go-version: ${{ steps.target-go.outputs.go127 }}
        architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
        cache: false
    - name: Select Go 1.27 GOROOT
      id: go127
      shell: bash
      env:
        BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
        BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
        TARGET_VERSION: ${{ steps.target-go.outputs.go127 }}
      run: "target_goroot=\"$(go env GOROOT)\"\nif [[ \"$TARGET_VERSION\" == \"$BUILD_VERSION\" ]]; then\n  target_goroot=\"$BUILD_GOROOT\"\nfi\nif [[ ! -d \"$target_goroot/test\" ]]; then\n  echo \"Target Go distribution does not contain GOROOT/test: $target_goroot\" >&2\n  exit 1\nfi\necho \"version=$TARGET_VERSION\" >> \"$GITHUB_OUTPUT\"\necho \"goroot=$target_goroot\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Activate native Windows target
      if: runner.os == 'Windows'
      uses: ./.github/actions/activate-windows-target
      with:
        windows-abi: ${{ matrix.windows_abi }}
        windows-arch: ${{ matrix.windows_arch }}
    - name: Show toolchain versions
      shell: bash
      env:
        GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
        GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
      run: "echo \"LLGo build toolchain: $LLGO_BUILD_GO_VERSION\"\nfor target_goroot in \"$GO126_GOROOT\" \"$GO127_GOROOT\"; do\n  target_go=\"$target_goroot/bin/go\"\n  if [[ \"$RUNNER_OS\" == Windows ]]; then\n    target_go+=.exe\n  fi\n  \"$target_go\" version\ndone\ngo env GOPROXY GOMODCACHE\nclang --version\n"
    - name: Run GOROOT runner
      shell: bash
      env:
        GOTOOLCHAIN: local
        GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
        GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
        PAIRED_SHARD_INDEX: ${{ matrix.paired-shard-index }}
      run: "export LLGO_STDIO_NOBUF=1\nmkdir -p \"$RUNNER_TEMP/goroot-logs\"\nstatus=0\nfor attempt in 1 2; do\n  for selection in \"1.26:$GO126_GOROOT\" \"1.27:$GO127_GOROOT\"; do\n    version=${selection%%:*}\n    target_goroot=${selection#*:}\n    log=\"$RUNNER_TEMP/goroot-logs/go${version}-attempt${attempt}.log\"\n    cache=\"$RUNNER_TEMP/goroot-cache/go${version}\"\n    mkdir -p \"$cache\"\n    set +e\n    (\n      cd test/goroot\n      env GOMAXPROCS=2 XDG_CACHE_HOME=\"$cache\" \\\n        \"$LLGO_GOROOT_RUNNER\" \\\n        -test.run='^TestGoRootRunCases$' -test.count=1 \\\n        -test.timeout=10m -test.v \\\n        -goroot \"$target_goroot\" -case='^gcgort.go$' \\\n        -run-timeout=5m -directive-mode ci \\\n        -min-swap-free-mib 512 -progress 30s \\\n        -shard-index 0 -shard-total 1\n    ) 2>&1 | tee \"$log\"\n    pipeline_status=(\"${PIPESTATUS[@]}\")\n    set -e\n    if (( pipeline_status[0] )); then status=1; fi\n  done\ndone\nexit \"$status\"\n"
    - name: Upload focused runtime logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-msvc-amd64-gcgort-logs
        path: ${{ runner.temp }}/goroot-logs
        if-no-files-found: error
