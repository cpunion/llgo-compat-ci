name: GOROOT failure replay

on:
  push:
    branches: [codex/goroot-daily-audit-20261013]
    paths: [.github/workflows/goroot-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.repository == 'cpunion/llgo-compat-ci'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: W32-WASI
            cases: '^gcgort\.go$'
            windows_abi: ''
            windows_arch: ''
            wasm_profile: W32-WASI
          - os: windows-2022
            platform: windows-msvc/386
            cases: '^fixedbugs/issue39541\.go$'
            windows_abi: msvc
            windows_arch: '386'
            wasm_profile: ''
    name: Replay (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: 63a406bea50a7bf58879318ee178202459c9932c
      - uses: actions/checkout@v7
        with:
          path: compatibility-ci
      - uses: ./compatibility-ci/.github/actions/setup-macos-intel-llvm
        id: intel-llvm
        if: matrix.platform == 'darwin/amd64'
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          install-llvm: ${{ matrix.platform != 'darwin/amd64' }}
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}
      - uses: ./.github/actions/setup-go
        with:
          architecture: ${{ startsWith(matrix.os, 'windows') && 'x64' || '' }}
      - uses: ./.github/actions/setup-binaryen
        if: matrix.wasm_profile != ''
      - name: Install qualified Wasmer PR 3 artifact
        if: matrix.wasm_profile == 'W32-WASI'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          package="$RUNNER_TEMP/wasmer-pr3"
          gh run download 37578522115 --repo xgo-dev/wasmer \
            --name wasmer-linux-amd64 --dir "$package"
          (
            cd "$package"
            sha256sum --check wasmer-linux-amd64.tar.gz.sha256
            tar -xzf wasmer-linux-amd64.tar.gz
            test "$(cat REVISION)" = "9b1ec57008d22f87f76ed86e8f6b274ce180f487"
          )
          chmod +x "$package/bin/wasmer"
          "$package/bin/wasmer" --version -v
          echo "$package/bin" >> "$GITHUB_PATH"
      - name: Build tools from pinned main
        shell: bash
        env:
          GOFLAGS: ${{ steps.intel-llvm.outputs.go-flags || env.GOFLAGS }}
          CGO_CPPFLAGS: ${{ steps.intel-llvm.outputs.cgo-cppflags || env.CGO_CPPFLAGS }}
          CGO_LDFLAGS: ${{ steps.intel-llvm.outputs.cgo-ldflags || env.CGO_LDFLAGS }}
        run: |
          LLGO_BUILD_GOROOT_RUNNER=1 dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "GO127_GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          llgo="$RUNNER_TEMP/llgo-bin/llgo${suffix}"
          if [[ "$RUNNER_OS" == Windows ]]; then llgo="$(cygpath -w "$llgo")"; fi
          echo "LLGO_TEST_LLGO=$llgo" >> "$GITHUB_ENV"
          echo "LLGO_GOROOT_RUNNER=$RUNNER_TEMP/llgo-bin/goroot-runner${suffix}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.7
          architecture: ${{ startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false
      - name: Record Go 1.26 GOROOT
        shell: bash
        run: echo "GO126_GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        if: runner.os == 'Windows'
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}
      - name: Replay both versions without corpus changes
        shell: bash
        env:
          CASES: ${{ matrix.cases }}
          WASM_PROFILE: ${{ matrix.wasm_profile }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay"
          printf 'timeouts: []\nflakes: []\nxfails: []\n' > "$RUNNER_TEMP/replay/empty-expectations.yaml"
          export LLGO_ROOT="$GITHUB_WORKSPACE"
          export LLGO_STDIO_NOBUF=1
          status=0
          for version in 126 127; do
            root_var="GO${version}_GOROOT"
            root="${!root_var}"
            set +e
            (
              cd test/goroot
              env GOMAXPROCS=2 XDG_CACHE_HOME="$RUNNER_TEMP/replay/cache-go${version}" \
                "$LLGO_GOROOT_RUNNER" -test.run='^TestGoRootRunCases$' \
                -test.v -test.count=3 -test.timeout=30m -goroot "$root" \
                -directive-mode ci -case "$CASES" -wasm-profile "$WASM_PROFILE" -run-timeout 5m \
                -xfail "$RUNNER_TEMP/replay/empty-expectations.yaml" -keepwork \
                -progress 30s
            ) 2>&1 | tee "$RUNNER_TEMP/replay/go${version}.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            if [[ "${codes[0]}" != 0 ]]; then status=1; fi
          done
          exit "$status"
      - name: Preserve replay logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.os }}
          path: ${{ runner.temp }}/replay/*.log
