name: GOROOT remaining shard qualification
on:
  push:
    branches: [codex/goroot-remaining-replay-20261016]
    paths:
      - .github/workflows/goroot-remaining-qualification.yml
      - scripts/cond_lifetime_macos.c
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  LLGO_REF: 78b265a3189d030ea0fd2c675a86627087e2994c
jobs:
  native:
    name: Qualify (${{ matrix.platform }}, paired shard ${{ matrix.shard-index }})
    if: github.repository == 'cpunion/llgo-compat-ci'
    timeout-minutes: 180
    outputs:
      expected-reports: ${{ steps.report-count.outputs.count }}
    env:
      GOPROXY: https://proxy.golang.org,direct
      LLGO_GOROOT_HEARTBEAT_SECONDS: "60"
      # Leave thirty minutes for setup plus timeout diagnostics and artifacts.
      LLGO_GOROOT_TEST_TIMEOUT: "150m"
      LLGO_GOROOT_VERBOSE: "1"
      LLGO_GOROOT_SHARD_TOTAL: ${{ matrix.shard-total }}
    strategy:
      fail-fast: false
      matrix: {"include": [{"platform": "windows-msvc/386", "os": "windows-2022", "windows_abi": "msvc", "windows_arch": "386", "wasm_profile": "", "shard-index": "3", "shard-total": "8", "paired-shard-index": "7"}, {"platform": "windows-mingw/386", "os": "windows-2022", "windows_abi": "mingw", "windows_arch": "386", "wasm_profile": "", "shard-index": "3", "shard-total": "8", "paired-shard-index": "7"}, {"platform": "darwin/amd64", "os": "macos-15-intel", "windows_abi": "", "windows_arch": "", "wasm_profile": "", "shard-index": "1", "shard-total": "8", "paired-shard-index": "5"}]}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Record expected matrix reports
        id: report-count
        shell: bash
        env:
          MATRIX_JOB_TOTAL: ${{ strategy.job-total }}
        # Each configured job reports Go 1.26 and Go 1.27, even when it runs
        # selected subshards of a larger corpus partition.
        run: echo "count=$((MATRIX_JOB_TOTAL * 2))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: ${{ env.LLGO_REF }}

      - name: Resolve target Go versions
        id: target-go
        shell: bash
        run: |
          source dev/go_toolchain.sh
          echo "go126=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.26)" >> "$GITHUB_OUTPUT"
          echo "go127=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.27)" >> "$GITHUB_OUTPUT"

      - name: Check out Intel LLVM setup
        if: matrix.platform == 'darwin/amd64'
        uses: actions/checkout@v7
        with:
          path: compatibility-ci
      - uses: ./compatibility-ci/.github/actions/setup-macos-intel-llvm
        id: intel-llvm
        if: matrix.platform == 'darwin/amd64'

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          install-llvm: ${{ matrix.platform != 'darwin/amd64' }}
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Set up Go for building LLGo and the runner
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}

      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.wasm_profile != ''
        with:
          version: '6.0.8'
      - uses: ./.github/actions/setup-binaryen
        if: matrix.wasm_profile != ''

      - name: Build LLGo and the GOROOT runner
        id: build-tools
        shell: bash
        env:
          GOFLAGS: ${{ steps.intel-llvm.outputs.go-flags || env.GOFLAGS }}
          CGO_CPPFLAGS: ${{ steps.intel-llvm.outputs.cgo-cppflags || env.CGO_CPPFLAGS }}
          CGO_LDFLAGS: ${{ steps.intel-llvm.outputs.cgo-ldflags || env.CGO_LDFLAGS }}
        run: |
          LLGO_BUILD_GOROOT_RUNNER=1 dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"

          build_version="$(go env GOVERSION)"
          build_version="${build_version#go}"
          echo "go-version=$build_version" >> "$GITHUB_OUTPUT"
          echo "goroot=$(go env GOROOT)" >> "$GITHUB_OUTPUT"
          echo "LLGO_BUILD_GO_VERSION=$build_version" >> "$GITHUB_ENV"

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
          fi
          runner="$RUNNER_TEMP/llgo-bin/goroot-runner${tool_suffix}"
          llgo="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The shell launches the runner, while the Go runner launches
            # llgo through the native Windows process API.
            llgo="$(cygpath -w "$llgo")"
          fi
          echo "LLGO_GOROOT_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "LLGO_TEST_LLGO=$llgo" >> "$GITHUB_ENV"

      # The toolchain module downloaded through GOTOOLCHAIN omits GOROOT/test.
      # Install the complete distribution after building LLGo and the runner,
      # so those binaries always use .go-version while the corpus can vary.
      - name: Set up target Go 1.26
        if: steps.target-go.outputs.go126 != steps.build-tools.outputs.go-version
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.go126 }}
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false

      - name: Select Go 1.26 GOROOT
        id: go126
        shell: bash
        env:
          BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
          BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
          TARGET_VERSION: ${{ steps.target-go.outputs.go126 }}
        run: |
          target_goroot="$(go env GOROOT)"
          if [[ "$TARGET_VERSION" == "$BUILD_VERSION" ]]; then
            target_goroot="$BUILD_GOROOT"
          fi
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "goroot=$target_goroot" >> "$GITHUB_OUTPUT"

      - name: Set up target Go 1.27
        if: steps.target-go.outputs.go127 != steps.build-tools.outputs.go-version
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.go127 }}
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false

      - name: Select Go 1.27 GOROOT
        id: go127
        shell: bash
        env:
          BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
          BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
          TARGET_VERSION: ${{ steps.target-go.outputs.go127 }}
        run: |
          target_goroot="$(go env GOROOT)"
          if [[ "$TARGET_VERSION" == "$BUILD_VERSION" ]]; then
            target_goroot="$BUILD_GOROOT"
          fi
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "goroot=$target_goroot" >> "$GITHUB_OUTPUT"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Verify native target identity
        if: matrix.wasm_profile == ''
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          target_os=$(go env GOOS)
          if [[ "$RUNNER_OS" == Windows ]]; then
            target_os="windows-${LLGO_WINDOWS_ABI}"
          fi
          actual="$target_os/$(go env GOARCH)"
          if [[ "$actual" != "$TARGET_PLATFORM" ]]; then
            echo "error: target is $actual, expected $TARGET_PLATFORM" >&2
            exit 1
          fi

      - name: Show toolchain versions
        shell: bash
        env:
          GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
          GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
        run: |
          echo "LLGo build toolchain: $LLGO_BUILD_GO_VERSION"
          for target_goroot in "$GO126_GOROOT" "$GO127_GOROOT"; do
            target_go="$target_goroot/bin/go"
            if [[ "$RUNNER_OS" == Windows ]]; then
              target_go+=.exe
            fi
            "$target_go" version
          done
          go env GOPROXY GOMODCACHE
          clang --version

      - name: Run GOROOT runner
        shell: bash
        env:
          GOTOOLCHAIN: local
          GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
          GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
          PAIRED_SHARD_INDEX: ${{ matrix.paired-shard-index }}
        run: |
          min_swap_free_mib=512
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # macOS manages swap dynamically; a low instantaneous free value
            # does not mean the runner cannot make forward progress.
            min_swap_free_mib=0
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Generated programs write into pipes and terminate through
            # ExitProcess, which does not run CRT stream teardown.
            export LLGO_STDIO_NOBUF=1
          fi
          mkdir -p "$RUNNER_TEMP/goroot-logs" "$RUNNER_TEMP/goroot-cache"
          shard_index=${{ matrix.shard-index }}
          paired_shard_index=${PAIRED_SHARD_INDEX:-$(((shard_index + LLGO_GOROOT_SHARD_TOTAL / 2) % LLGO_GOROOT_SHARD_TOTAL))}

          run_goroot() {
            local target_goroot=$1
            local version=$2
            local target_shard=$3
            local log="$RUNNER_TEMP/goroot-logs/go${version}.log"
            local cache="$RUNNER_TEMP/goroot-cache/go${version}"
            mkdir -p "$cache"
            set +e
            (
              cd test/goroot
              env GOMAXPROCS=2 XDG_CACHE_HOME="$cache" \
                "$LLGO_GOROOT_RUNNER" \
                -test.run='^TestGoRootRunCases$' -test.count=1 \
                -test.timeout="$LLGO_GOROOT_TEST_TIMEOUT" -test.v \
                -goroot "$target_goroot" \
                -directive-mode ci \
                -min-swap-free-mib "$min_swap_free_mib" \
                -max-rss-mib "$max_rss_mib" \
                -progress 60s \
                -shard-index "$target_shard" \
                -shard-total "$LLGO_GOROOT_SHARD_TOTAL"
            ) 2>&1 | tee "$log"
            local pipeline_status=("${PIPESTATUS[@]}")
            set -e
            return "${pipeline_status[0]}"
          }

          status=0
          serial_versions=0
          max_rss_mib=4096
          # Isolate large generated builds and Windows reflection stress from
          # their paired compiler. Intel macOS rangegen also exceeds 4 GiB.
          serial_cases=
          if [[ "$RUNNER_OS" == "Windows" ]] && {
            [[ "${{ matrix.windows_arch }}" == "amd64" ]] || [[ "${{ matrix.windows_arch }}" == "arm64" ]]
          }; then
            serial_cases='(^|[[:space:]])(rangegen\.go|fixedbugs/issue39541\.go)$'
          elif [[ "$RUNNER_OS" == "Windows" && "${{ matrix.windows_arch }}" == "386" ]]; then
            serial_cases='(^|[[:space:]])(index0\.go|cmplxdivide\.go|fixedbugs/issue39541\.go)$'
          elif [[ "${{ matrix.platform }}" == "darwin/amd64" ]]; then
            serial_cases='(^|[[:space:]])(rangegen\.go|ken/chan\.go)$'
          fi
          if [[ -n "$serial_cases" ]]; then
            for selection in "${{ steps.go126.outputs.version }}:$shard_index" "${{ steps.go127.outputs.version }}:$paired_shard_index"; do
              version=${selection%:*}
              target_shard=${selection##*:}
              target_goroot=$GO126_GOROOT
              if [[ "$version" == "${{ steps.go127.outputs.version }}" ]]; then
                target_goroot=$GO127_GOROOT
              fi
              case_list="$RUNNER_TEMP/goroot-cases-go${version}.txt"
              (
                cd test/goroot
                "$LLGO_GOROOT_RUNNER" -test.run='^TestGoRootRunCases$' -test.count=1 \
                  -goroot "$target_goroot" -directive-mode ci -list-case-paths \
                  -shard-index "$target_shard" -shard-total "$LLGO_GOROOT_SHARD_TOTAL"
              ) >"$case_list" 2>&1
              if grep -Eq "$serial_cases" "$case_list"; then
                echo "Serializing Go versions for resource-heavy cases in Go $version shard $target_shard/$LLGO_GOROOT_SHARD_TOTAL"
                serial_versions=1
                if [[ "${{ matrix.platform }}" == "darwin/amd64" ]] && grep -Eq '(^|[[:space:]])rangegen\.go$' "$case_list"; then
                  max_rss_mib=8192
                fi
              fi
              rm -f "$case_list"
            done
          fi
          if [[ "$LLGO_GOROOT_SHARD_TOTAL" == "8" ]] && {
            [[ "$RUNNER_OS" == "Linux" && "$shard_index" == "6" ]] ||
            [[ "$RUNNER_OS" == "macOS" && "$shard_index" == "5" ]]
          }; then
            serial_versions=1
          fi
          if (( serial_versions )); then
            run_goroot "$GO126_GOROOT" "${{ steps.go126.outputs.version }}" "$shard_index" || status=1
            run_goroot "$GO127_GOROOT" "${{ steps.go127.outputs.version }}" "$paired_shard_index" || status=1
          else
            run_goroot "$GO126_GOROOT" "${{ steps.go126.outputs.version }}" "$shard_index" &
            pids=("$!")
            run_goroot "$GO127_GOROOT" "${{ steps.go127.outputs.version }}" "$paired_shard_index" &
            pids+=("$!")
            for pid in "${pids[@]}"; do
              wait "$pid" || status=1
            done
          fi
          exit "$status"

      - name: Check condition lifetime with spurious wakes
        if: matrix.platform == 'darwin/amd64'
        shell: bash
        env:
          TARGET_GOROOT: ${{ steps.go127.outputs.goroot }}
        run: |
          mkdir -p "$RUNNER_TEMP/goroot-logs"
          export LLGO_ROOT="$GITHUB_WORKSPACE" GOROOT="$TARGET_GOROOT"
          export PATH="$TARGET_GOROOT/bin:$PATH"
          clang -std=c11 -dynamiclib -O2 compatibility-ci/scripts/cond_lifetime_macos.c -o "$RUNNER_TEMP/cond-lifetime.dylib"
          "$LLGO_TEST_LLGO" build -o "$RUNNER_TEMP/ken-chan-fixed" "$TARGET_GOROOT/test/ken/chan.go"
          for iteration in 1 2 3; do
            env DYLD_INSERT_LIBRARIES="$RUNNER_TEMP/cond-lifetime.dylib" "$RUNNER_TEMP/ken-chan-fixed" 2>&1 | tee "$RUNNER_TEMP/goroot-logs/signal-lifetime-$iteration.log"
          done
      - name: Preserve full shard logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remaining-qualified-${{ matrix.os }}-${{ matrix.windows_abi }}
          path: ${{ runner.temp }}/goroot-logs/*.log

  wasm:
    name: Qualify (${{ matrix.platform }}, paired shard ${{ matrix.shard-index }})
    if: github.repository == 'cpunion/llgo-compat-ci'
    timeout-minutes: 180
    outputs:
      expected-reports: ${{ steps.report-count.outputs.count }}
    env:
      GOPROXY: https://proxy.golang.org,direct
      LLGO_GOROOT_HEARTBEAT_SECONDS: "60"
      # Leave thirty minutes for setup plus timeout diagnostics and artifacts.
      LLGO_GOROOT_TEST_TIMEOUT: "150m"
      LLGO_GOROOT_VERBOSE: "1"
      LLGO_GOROOT_SHARD_TOTAL: ${{ matrix.shard-total }}
    strategy:
      fail-fast: false
      matrix: {"include": [{"platform": "J32-Emscripten", "os": "ubuntu-24.04", "windows_abi": "", "windows_arch": "", "wasm_profile": "J32-Emscripten", "shard-index": "15", "shard-total": "16", "paired-shard-index": "7"}]}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Record expected matrix reports
        id: report-count
        shell: bash
        env:
          MATRIX_JOB_TOTAL: ${{ strategy.job-total }}
        # Each configured job reports Go 1.26 and Go 1.27, even when it runs
        # selected subshards of a larger corpus partition.
        run: echo "count=$((MATRIX_JOB_TOTAL * 2))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: ${{ env.LLGO_REF }}

      - name: Resolve target Go versions
        id: target-go
        shell: bash
        run: |
          source dev/go_toolchain.sh
          echo "go126=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.26)" >> "$GITHUB_OUTPUT"
          echo "go127=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.27)" >> "$GITHUB_OUTPUT"

      - name: Check out Intel LLVM setup
        if: matrix.platform == 'darwin/amd64'
        uses: actions/checkout@v7
        with:
          path: compatibility-ci
      - uses: ./compatibility-ci/.github/actions/setup-macos-intel-llvm
        id: intel-llvm
        if: matrix.platform == 'darwin/amd64'

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          install-llvm: ${{ matrix.platform != 'darwin/amd64' }}
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Set up Go for building LLGo and the runner
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}

      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.wasm_profile != ''
        with:
          version: '6.0.8'
      - uses: ./.github/actions/setup-binaryen
        if: matrix.wasm_profile != ''

      - name: Build LLGo and the GOROOT runner
        id: build-tools
        shell: bash
        env:
          GOFLAGS: ${{ steps.intel-llvm.outputs.go-flags || env.GOFLAGS }}
          CGO_CPPFLAGS: ${{ steps.intel-llvm.outputs.cgo-cppflags || env.CGO_CPPFLAGS }}
          CGO_LDFLAGS: ${{ steps.intel-llvm.outputs.cgo-ldflags || env.CGO_LDFLAGS }}
        run: |
          LLGO_BUILD_GOROOT_RUNNER=1 dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"

          build_version="$(go env GOVERSION)"
          build_version="${build_version#go}"
          echo "go-version=$build_version" >> "$GITHUB_OUTPUT"
          echo "goroot=$(go env GOROOT)" >> "$GITHUB_OUTPUT"
          echo "LLGO_BUILD_GO_VERSION=$build_version" >> "$GITHUB_ENV"

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
          fi
          runner="$RUNNER_TEMP/llgo-bin/goroot-runner${tool_suffix}"
          llgo="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The shell launches the runner, while the Go runner launches
            # llgo through the native Windows process API.
            llgo="$(cygpath -w "$llgo")"
          fi
          echo "LLGO_GOROOT_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "LLGO_TEST_LLGO=$llgo" >> "$GITHUB_ENV"

      # The toolchain module downloaded through GOTOOLCHAIN omits GOROOT/test.
      # Install the complete distribution after building LLGo and the runner,
      # so those binaries always use .go-version while the corpus can vary.
      - name: Set up target Go 1.26
        if: steps.target-go.outputs.go126 != steps.build-tools.outputs.go-version
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.go126 }}
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false

      - name: Select Go 1.26 GOROOT
        id: go126
        shell: bash
        env:
          BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
          BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
          TARGET_VERSION: ${{ steps.target-go.outputs.go126 }}
        run: |
          target_goroot="$(go env GOROOT)"
          if [[ "$TARGET_VERSION" == "$BUILD_VERSION" ]]; then
            target_goroot="$BUILD_GOROOT"
          fi
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "goroot=$target_goroot" >> "$GITHUB_OUTPUT"

      - name: Set up target Go 1.27
        if: steps.target-go.outputs.go127 != steps.build-tools.outputs.go-version
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.go127 }}
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false

      - name: Select Go 1.27 GOROOT
        id: go127
        shell: bash
        env:
          BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
          BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
          TARGET_VERSION: ${{ steps.target-go.outputs.go127 }}
        run: |
          target_goroot="$(go env GOROOT)"
          if [[ "$TARGET_VERSION" == "$BUILD_VERSION" ]]; then
            target_goroot="$BUILD_GOROOT"
          fi
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "goroot=$target_goroot" >> "$GITHUB_OUTPUT"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Verify native target identity
        if: matrix.wasm_profile == ''
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          target_os=$(go env GOOS)
          if [[ "$RUNNER_OS" == Windows ]]; then
            target_os="windows-${LLGO_WINDOWS_ABI}"
          fi
          actual="$target_os/$(go env GOARCH)"
          if [[ "$actual" != "$TARGET_PLATFORM" ]]; then
            echo "error: target is $actual, expected $TARGET_PLATFORM" >&2
            exit 1
          fi

      - name: Show toolchain versions
        shell: bash
        env:
          GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
          GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
        run: |
          echo "LLGo build toolchain: $LLGO_BUILD_GO_VERSION"
          for target_goroot in "$GO126_GOROOT" "$GO127_GOROOT"; do
            target_go="$target_goroot/bin/go"
            if [[ "$RUNNER_OS" == Windows ]]; then
              target_go+=.exe
            fi
            "$target_go" version
          done
          go env GOPROXY GOMODCACHE
          clang --version

      - name: Run GOROOT runner
        shell: bash
        env:
          GOTOOLCHAIN: local
          GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
          GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
        run: |
          mkdir -p "$RUNNER_TEMP/goroot-logs" "$RUNNER_TEMP/goroot-cache"
          shard_index=${{ matrix.shard-index }}
          paired_shard_index=$(((shard_index + LLGO_GOROOT_SHARD_TOTAL / 2) % LLGO_GOROOT_SHARD_TOTAL))

          # Go's Node wrapper reserves only 8 KiB for argv and env. Repository
          # metadata is irrelevant to the test processes and can exceed that
          # limit when every GITHUB_/ACTIONS_ variable is inherited.
          for name in $(compgen -e); do
            case "$name" in
              GITHUB_*|ACTIONS_*) unset "$name" ;;
            esac
          done

          run_goroot() {
            local target_goroot=$1
            local version=$2
            local target_shard=$3
            local log="$RUNNER_TEMP/goroot-logs/go${version}.log"
            local cache="$RUNNER_TEMP/goroot-cache/go${version}"
            mkdir -p "$cache"
            set +e
            (
              cd test/goroot
              max_rss_mib=4096
              # Case-to-shard placement changes with the Go version and the
              # active directive set. Detect rangegen.go from the actual
              # selected case list instead of assuming a fixed shard.
              case_list="$RUNNER_TEMP/goroot-cases-go${version}.txt"
              if env GOMAXPROCS=2 XDG_CACHE_HOME="$cache" \
                "$LLGO_GOROOT_RUNNER" \
                -test.run='^TestGoRootRunCases$' -test.count=1 \
                -goroot "$target_goroot" \
                -directive-mode ci \
                -wasm-profile "${{ matrix.wasm_profile }}" \
                -list-case-paths \
                -shard-index "$target_shard" \
                -shard-total "$LLGO_GOROOT_SHARD_TOTAL" \
                >"$case_list" 2>&1 && grep -Eq '(^|[[:space:]])rangegen\.go$' "$case_list"; then
                # rangegen.go's Wasm compiler process peaks around
                # 7 GiB. Raise the RSS cap only for shards containing it;
                # per-case build timeouts come from llgo's test metadata.
                max_rss_mib=8192
              fi
              rm -f "$case_list"
              env GOMAXPROCS=2 XDG_CACHE_HOME="$cache" \
                "$LLGO_GOROOT_RUNNER" \
                -test.run='^TestGoRootRunCases$' -test.count=1 \
                -test.timeout="$LLGO_GOROOT_TEST_TIMEOUT" -test.v \
                -goroot "$target_goroot" \
                -directive-mode ci \
                -wasm-profile "${{ matrix.wasm_profile }}" \
                -max-rss-mib "$max_rss_mib" \
                -progress 60s \
                -shard-index "$target_shard" \
                -shard-total "$LLGO_GOROOT_SHARD_TOTAL"
            ) 2>&1 | tee "$log"
            local pipeline_status=("${PIPESTATUS[@]}")
            set -e
            return "${pipeline_status[0]}"
          }

          # The complete GOROOT filesystem walk competes with the paired
          # compiler on Emscripten32. Detect it from either version's shard.
          serial_versions=0
          if [[ "${{ matrix.wasm_profile }}" == "J32-Emscripten" ]]; then
            for selection in "${{ steps.go126.outputs.version }}:$shard_index" "${{ steps.go127.outputs.version }}:$paired_shard_index"; do
              version=${selection%:*}
              target_shard=${selection##*:}
              target_goroot=$GO126_GOROOT
              if [[ "$version" == "${{ steps.go127.outputs.version }}" ]]; then
                target_goroot=$GO127_GOROOT
              fi
              case_list="$RUNNER_TEMP/goroot-serial-go${version}.txt"
              "$LLGO_GOROOT_RUNNER" -test.run='^TestGoRootRunCases$' -test.count=1 \
                -goroot "$target_goroot" -directive-mode ci \
                -wasm-profile "${{ matrix.wasm_profile }}" -list-case-paths \
                -shard-index "$target_shard" -shard-total "$LLGO_GOROOT_SHARD_TOTAL" \
                >"$case_list" 2>&1
              if grep -Eq '(^|[[:space:]])winbatch\.go$' "$case_list"; then
                echo "Serializing Go versions for winbatch.go in Go $version shard $target_shard/$LLGO_GOROOT_SHARD_TOTAL"
                serial_versions=1
              fi
              rm -f "$case_list"
            done
          fi
          status=0
          if (( serial_versions )); then
            run_goroot "$GO126_GOROOT" "${{ steps.go126.outputs.version }}" "$shard_index" || status=1
            run_goroot "$GO127_GOROOT" "${{ steps.go127.outputs.version }}" "$paired_shard_index" || status=1
          else
            run_goroot "$GO126_GOROOT" "${{ steps.go126.outputs.version }}" "$shard_index" &
            pids=("$!")
            run_goroot "$GO127_GOROOT" "${{ steps.go127.outputs.version }}" "$paired_shard_index" &
            pids+=("$!")
            for pid in "${pids[@]}"; do
              wait "$pid" || status=1
            done
          fi
          exit "$status"

      - name: Preserve full shard logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remaining-qualified-${{ matrix.os }}-${{ matrix.windows_abi }}
          path: ${{ runner.temp }}/goroot-logs/*.log
