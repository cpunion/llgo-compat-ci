name: GOROOT resume cancelled jobs

on:
  push:
    branches: [codex/goroot-priority-failures-20261006]
    paths: [.github/workflows/goroot-resume.yml]

permissions:
  contents: read

jobs:
  goroot:
    name: GOROOT (${{ matrix.os }}${{ startsWith(matrix.os, 'windows') && format(', {0}, {1}', matrix.windows_abi, matrix.windows_arch) || '' }}, Go 1.26+1.27, shard ${{ matrix.shard-index }}/${{ matrix.shard-total }})
    timeout-minutes: 180
    outputs:
      expected-reports: ${{ steps.report-count.outputs.count }}
    env:
      GOPROXY: https://proxy.golang.org,direct
      LLGO_GOROOT_HEARTBEAT_SECONDS: "60"
      # Leave thirty minutes for setup plus timeout diagnostics and artifacts.
      LLGO_GOROOT_TEST_TIMEOUT: "150m"
      LLGO_GOROOT_VERBOSE: "1"
      LLGO_GOROOT_SHARD_TOTAL: ${{ matrix.shard-total }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-2022"
            windows_abi: "mingw"
            windows_arch: "amd64"
            shard-index: "6"
            shard-total: "8"
          - os: "windows-2022"
            windows_abi: "msvc"
            windows_arch: "386"
            shard-index: "4"
            shard-total: "8"
          - os: "macos-latest"
            windows_abi: "msvc"
            windows_arch: "amd64"
            shard-index: "0"
            shard-total: "8"
