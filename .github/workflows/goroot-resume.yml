          - os: "windows-2022"
            windows_abi: "mingw"
            windows_arch: "amd64"
            shard-index: "5"
            shard-total: "8"
          - os: "windows-2022"
            windows_abi: "mingw"
            windows_arch: "386"
            shard-index: "7"
            shard-total: "8"
          - os: "windows-2022"
