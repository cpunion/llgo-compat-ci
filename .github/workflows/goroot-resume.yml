            windows_abi: "mingw"
            windows_arch: "amd64"
            shard-index: "3"
            shard-total: "8"
          - os: "windows-2022"
            windows_abi: "msvc"
            windows_arch: "386"
            shard-index: "5"
            shard-total: "8"
          - os: "windows-2022"
            windows_abi: "mingw"
            windows_arch: "amd64"
            shard-index: "4"
            shard-total: "8"
          - os: "windows-2022"
            windows_abi: "msvc"
            windows_arch: "amd64"
            shard-index: "1"
