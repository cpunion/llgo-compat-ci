          - os: "windows-11-arm"
            windows_abi: "msvc"
            windows_arch: "arm64"
            shard-index: "30"
            shard-total: "32"
            paired-shard-index: "26"
          - os: "windows-11-arm"
            windows_abi: "mingw"
            windows_arch: "arm64"
            shard-index: "0"
            shard-total: "16"
            paired-shard-index: "4"
          - os: "windows-11-arm"
            windows_abi: "mingw"
            windows_arch: "arm64"
            shard-index: "24"
            shard-total: "32"
            paired-shard-index: "28"
          - os: "windows-11-arm"
            windows_abi: "mingw"
            windows_arch: "arm64"
            shard-index: "8"
            shard-total: "32"
            paired-shard-index: "12"
          - os: "windows-11-arm"
            windows_abi: "mingw"
            windows_arch: "arm64"
            shard-index: "12"
            shard-total: "16"
            paired-shard-index: "8"
          - os: "windows-11-arm"
            windows_abi: "mingw"
            windows_arch: "arm64"
            shard-index: "15"
            shard-total: "16"
            paired-shard-index: "11"
          - os: "windows-11-arm"
            windows_abi: "mingw"
            windows_arch: "arm64"
            shard-index: "4"
            shard-total: "16"
            paired-shard-index: "0"
          - os: "windows-11-arm"
            windows_abi: "mingw"
            windows_arch: "arm64"
            shard-index: "6"
            shard-total: "16"
            paired-shard-index: "2"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Record expected matrix reports
        id: report-count
        shell: bash
        env:
          MATRIX_JOB_TOTAL: ${{ strategy.job-total }}
        # Each configured job reports Go 1.26 and Go 1.27, even when it runs
        # selected subshards of a larger corpus partition.
        run: echo "count=$((MATRIX_JOB_TOTAL * 2))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: 254723f2a817ea526ef6fb3e687d5849cee33e9c

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Set up Go for building LLGo and the runner
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}

      - name: Build LLGo and the GOROOT runner
        id: build-tools
        shell: bash
        run: |
          LLGO_BUILD_GOROOT_RUNNER=1 dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"

          build_version="$(go env GOVERSION)"
          build_version="${build_version#go}"
          echo "go-version=$build_version" >> "$GITHUB_OUTPUT"
          echo "goroot=$(go env GOROOT)" >> "$GITHUB_OUTPUT"
          echo "LLGO_BUILD_GO_VERSION=$build_version" >> "$GITHUB_ENV"

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
          fi
          runner="$RUNNER_TEMP/llgo-bin/goroot-runner${tool_suffix}"
          llgo="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The shell launches the runner, while the Go runner launches
            # llgo through the native Windows process API.
            llgo="$(cygpath -w "$llgo")"
          fi
          echo "LLGO_GOROOT_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "LLGO_TEST_LLGO=$llgo" >> "$GITHUB_ENV"

      - name: Resolve target Go versions
        id: target-go
        shell: bash
        run: |
          source dev/go_toolchain.sh
          echo "go126=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.26)" >> "$GITHUB_OUTPUT"
          echo "go127=$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.27)" >> "$GITHUB_OUTPUT"

      # The toolchain module downloaded through GOTOOLCHAIN omits GOROOT/test.
      # Install the complete distribution after building LLGo and the runner,
      # so those binaries always use .go-version while the corpus can vary.
      - name: Set up target Go 1.26
        if: steps.target-go.outputs.go126 != steps.build-tools.outputs.go-version
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.go126 }}
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false

      - name: Select Go 1.26 GOROOT
        id: go126
        shell: bash
        env:
          BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
          BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
          TARGET_VERSION: ${{ steps.target-go.outputs.go126 }}
        run: |
          target_goroot="$(go env GOROOT)"
          if [[ "$TARGET_VERSION" == "$BUILD_VERSION" ]]; then
            target_goroot="$BUILD_GOROOT"
          fi
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "goroot=$target_goroot" >> "$GITHUB_OUTPUT"

      - name: Set up target Go 1.27
        if: steps.target-go.outputs.go127 != steps.build-tools.outputs.go-version
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.go127 }}
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false

      - name: Select Go 1.27 GOROOT
        id: go127
        shell: bash
        env:
          BUILD_GOROOT: ${{ steps.build-tools.outputs.goroot }}
          BUILD_VERSION: ${{ steps.build-tools.outputs.go-version }}
          TARGET_VERSION: ${{ steps.target-go.outputs.go127 }}
        run: |
          target_goroot="$(go env GOROOT)"
          if [[ "$TARGET_VERSION" == "$BUILD_VERSION" ]]; then
            target_goroot="$BUILD_GOROOT"
          fi
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "goroot=$target_goroot" >> "$GITHUB_OUTPUT"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Show toolchain versions
        shell: bash
        env:
          GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
          GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
        run: |
          echo "LLGo build toolchain: $LLGO_BUILD_GO_VERSION"
          for target_goroot in "$GO126_GOROOT" "$GO127_GOROOT"; do
            target_go="$target_goroot/bin/go"
            if [[ "$RUNNER_OS" == Windows ]]; then
              target_go+=.exe
            fi
            "$target_go" version
          done
          go env GOPROXY GOMODCACHE
          clang --version

      - name: Verify Windows process identity regressions
        if: runner.os == 'Windows'
        shell: bash
        env:
          GOROOT: ${{ steps.build-tools.outputs.goroot }}
        run: |
          build_go="$GOROOT/bin/go.exe"
          env CGO_ENABLED=0 GOARCH="$("$build_go" env GOHOSTARCH)" "$build_go" test ./test/goroot -run '^TestWindows(ProcessTree|ProcessIdentity|ProcessTermination)' -count=1 -timeout=3m

      - name: Run GOROOT runner
        shell: bash
        env:
          GOTOOLCHAIN: local
          GO126_GOROOT: ${{ steps.go126.outputs.goroot }}
          GO127_GOROOT: ${{ steps.go127.outputs.goroot }}
          PAIRED_SHARD_INDEX: ${{ matrix.paired-shard-index }}
        run: |
          min_swap_free_mib=512
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # macOS manages swap dynamically; a low instantaneous free value
            # does not mean the runner cannot make forward progress.
            min_swap_free_mib=0
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Generated programs write into pipes and terminate through
            # ExitProcess, which does not run CRT stream teardown.
            export LLGO_STDIO_NOBUF=1
          fi
          mkdir -p "$RUNNER_TEMP/goroot-logs" "$RUNNER_TEMP/goroot-cache"
          shard_index=${{ matrix.shard-index }}
          paired_shard_index=${PAIRED_SHARD_INDEX:-$(((shard_index + LLGO_GOROOT_SHARD_TOTAL / 2) % LLGO_GOROOT_SHARD_TOTAL))}

          run_goroot() {
            local target_goroot=$1
            local version=$2
            local target_shard=$3
            local log="$RUNNER_TEMP/goroot-logs/go${version}.log"
            local cache="$RUNNER_TEMP/goroot-cache/go${version}"
            mkdir -p "$cache"
            set +e
            (
              cd test/goroot
              env GOMAXPROCS=2 XDG_CACHE_HOME="$cache" \
                "$LLGO_GOROOT_RUNNER" \
                -test.run='^TestGoRootRunCases$' -test.count=1 \
                -test.timeout="$LLGO_GOROOT_TEST_TIMEOUT" -test.v \
                -goroot "$target_goroot" \
                -directive-mode ci \
                -min-swap-free-mib "$min_swap_free_mib" \
                -progress 60s \
                -shard-index "$target_shard" \
                -shard-total "$LLGO_GOROOT_SHARD_TOTAL"
            ) 2>&1 | tee "$log"
            local pipeline_status=("${PIPESTATUS[@]}")
            set -e
            return "${pipeline_status[0]}"
          }

          status=0
          serial_versions=0
          # Keep the million-call reflection stress loop isolated from its
          # paired compiler. The 64-bit rangegen builds also peak above 3 GiB
          # apiece. Find these cases in the actual platform/version corpus.
          if [[ "$RUNNER_OS" == "Windows" ]] && {
            [[ "${{ matrix.windows_arch }}" == "amd64" ]] || [[ "${{ matrix.windows_arch }}" == "arm64" ]]
          }; then
            serial_cases='(^|[[:space:]])(rangegen\.go|fixedbugs/issue39541\.go)$'
            for selection in "${{ steps.go126.outputs.version }}:$shard_index" "${{ steps.go127.outputs.version }}:$paired_shard_index"; do
              version=${selection%:*}
              target_shard=${selection##*:}
              target_goroot=$GO126_GOROOT
              if [[ "$version" == "${{ steps.go127.outputs.version }}" ]]; then
                target_goroot=$GO127_GOROOT
              fi
              case_list="$RUNNER_TEMP/goroot-cases-go${version}.txt"
              (
                cd test/goroot
                "$LLGO_GOROOT_RUNNER" -test.run='^TestGoRootRunCases$' -test.count=1 \
                  -goroot "$target_goroot" -directive-mode ci -list-case-paths \
                  -shard-index "$target_shard" -shard-total "$LLGO_GOROOT_SHARD_TOTAL"
              ) >"$case_list" 2>&1
              if grep -Eq "$serial_cases" "$case_list"; then
                echo "Serializing Go versions for resource-heavy cases in Go $version shard $target_shard/$LLGO_GOROOT_SHARD_TOTAL"
                serial_versions=1
              fi
              rm -f "$case_list"
            done
          fi
          if [[ "$LLGO_GOROOT_SHARD_TOTAL" == "8" ]] && {
            [[ "$RUNNER_OS" == "Linux" && "$shard_index" == "6" ]] ||
            [[ "$RUNNER_OS" == "macOS" && "$shard_index" == "5" ]]
          }; then
            serial_versions=1
          fi
          if (( serial_versions )); then
            run_goroot "$GO126_GOROOT" "${{ steps.go126.outputs.version }}" "$shard_index" || status=1
            run_goroot "$GO127_GOROOT" "${{ steps.go127.outputs.version }}" "$paired_shard_index" || status=1
          else
            run_goroot "$GO126_GOROOT" "${{ steps.go126.outputs.version }}" "$shard_index" &
            pids=("$!")
            run_goroot "$GO127_GOROOT" "${{ steps.go127.outputs.version }}" "$paired_shard_index" &
            pids+=("$!")
            for pid in "${pids[@]}"; do
              wait "$pid" || status=1
            done
          fi
          exit "$status"

      - name: Summarize GOROOT shard
        if: always()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          WINDOWS_ABI: ${{ matrix.windows_abi }}
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
          SHARD_INDEX: ${{ matrix.shard-index }}
          GO126_VERSION: ${{ steps.go126.outputs.version }}
          GO127_VERSION: ${{ steps.go127.outputs.version }}
        run: |
          report_dir="$RUNNER_TEMP/goroot-report"
          mkdir -p "$report_dir" "$RUNNER_TEMP/goroot-logs"

          platform=linux/amd64
          if [[ "$MATRIX_OS" == "macos-latest" ]]; then
            platform=darwin/arm64
          elif [[ "$MATRIX_OS" == "windows-2022" ]]; then
            platform="windows-${WINDOWS_ABI}/${WINDOWS_ARCH}"
          elif [[ "$MATRIX_OS" == "windows-11-arm" ]]; then
            platform="windows-${WINDOWS_ABI}/${WINDOWS_ARCH}"
          fi

          summarize_log() {
            local go_version=$1
            local log="$RUNNER_TEMP/goroot-logs/go${go_version}.log"
            local selected observed failed skipped passed report_id shard_info actual_shard shard_total
            touch "$log"
            shard_info=$(sed -nE 's/.* shard=([0-9]+)\/([0-9]+) cases=.*/\1 \2/p' "$log" | tail -1)
            read -r actual_shard shard_total <<<"$shard_info"
            actual_shard=${actual_shard:-$SHARD_INDEX}
            shard_total=${shard_total:-$LLGO_GOROOT_SHARD_TOTAL}
            selected=$(sed -nE 's/.* shard=[^ ]+ cases=([0-9]+) directive_mode=.*/\1/p' "$log" | tail -1)
            observed=$(grep -Ec -- '--- (PASS|FAIL|SKIP): TestGoRootRunCases/' "$log" || true)
            failed=$(grep -Ec -- '--- FAIL: TestGoRootRunCases/' "$log" || true)
            skipped=$(grep -Ec -- '--- SKIP: TestGoRootRunCases/' "$log" || true)
            passed=$((observed - failed - skipped))
            if [[ -z "$selected" ]]; then
              selected='?'
            fi

            report_id="${platform//\//-}-${go_version}-${actual_shard}"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$platform" "$go_version" "$actual_shard" "$selected" \
              "$observed" "$passed" "$failed" "$skipped" "$shard_total" \
              >"$report_dir/summary-$report_id.tsv"
            awk -F '\t' \
              -v platform="$platform" \
              -v version="$go_version" \
              -v shard="$actual_shard" '
                $1 == "GOROOT_CASE_RESULT" {
                  printf "%s\t%s\t%s\t%s\t%s\t%s\n", platform, version, shard, $2, $3, $4
                }
              ' "$log" >"$report_dir/cases-$report_id.tsv"

            echo "### GOROOT $platform · Go $go_version · shard $actual_shard/$shard_total"
            echo
            echo '| Selected | Observed | Passed | Failed | Skipped |'
            echo '|---:|---:|---:|---:|---:|'
            echo "| $selected | $observed | $passed | $failed | $skipped |"
            echo
            echo '_Passed means the runner classification succeeded; expected xfail/not-applicable failures and classified flakes are counted as Passed._'
            echo
            echo '**Failed case paths**'
            if [[ "$failed" -eq 0 ]]; then
              echo
              echo '- none'
            else
              # shellcheck disable=SC2016 # The backreference is expanded by sed.
              sed -nE 's|.*--- FAIL: TestGoRootRunCases/([^ ]+).*|- `\1`|p' "$log"
            fi
          }

          {
            summarize_log "$GO126_VERSION"
            echo
            summarize_log "$GO127_VERSION"
          } >>"$GITHUB_STEP_SUMMARY"

      # These short-lived artifacts only transport structured shard data to
      # goroot-summary. The human-readable report lives in the job summary.
      - name: Upload GOROOT shard statistics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goroot-stat-${{ matrix.os }}-${{ matrix.windows_abi }}-${{ matrix.windows_arch }}-${{ matrix.shard-index }}
          path: ${{ runner.temp }}/goroot-report
          if-no-files-found: error
          retention-days: 1

