name: Diagnose native Intel macOS GDB launch
on:
  push:
    branches: [codex/diagnose-windows-gcgort-20261006]
    paths: [.github/workflows/macos-gdb-diagnostics.yml]
permissions:
  contents: read
jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        host: [1, 2]
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: 7b032c61a52dbd7ab6d87df552c00f136b8c3cbb
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-gdb
      - name: Compare C launches and capture stuck debugger stacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gdb-diagnostics"
          cat > "$RUNNER_TEMP/gdb-diagnostics/control.c" <<'EOF'
          #include <stdio.h>
          int main(void) { puts("C launch completed"); return 0; }
          EOF
          clang -gdwarf-4 -O0 "$RUNNER_TEMP/gdb-diagnostics/control.c" -o "$RUNNER_TEMP/gdb-diagnostics/control"
          cat > "$RUNNER_TEMP/gdb-diagnostics/watch.py" <<'PY'
          import os, pathlib, signal, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gdb-diagnostics"
          name, timeout, *command = sys.argv[1:]
          with (root / (name + ".log")).open("w") as log:
              process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  code = process.wait(timeout=int(timeout))
              except subprocess.TimeoutExpired:
                  print("TIMEOUT:", name, "driver PID", process.pid, flush=True)
                  listing = subprocess.check_output(["ps", "-axo", "pid=,ppid=,state=,comm="], text=True)
                  (root / (name + "-processes.txt")).write_text(listing)
                  parents = {process.pid}
                  rows = [line.split(None, 3) for line in listing.splitlines()]
                  for _ in range(6):
                      parents.update(int(row[0]) for row in rows if len(row) == 4 and int(row[1]) in parents)
                  for row in rows:
                      if len(row) == 4 and int(row[0]) in parents:
                          print("DESCENDANT:", " ".join(row), flush=True)
                          if "gdb" in row[3] or row[3].endswith("/debug") or row[3].endswith("/control"):
                              try:
                                  subprocess.run(["sudo", "-n", "/usr/bin/sample", row[0], "3", "10", "-file", str(root / (name + "-sample-" + row[0] + ".txt"))], timeout=20, check=False)
                              except subprocess.TimeoutExpired:
                                  print("sample timed out:", row[0], flush=True)
                  subprocess.run(["sudo", "-n", "kill", "-KILL", "--", "-" + str(process.pid)], check=False)
                  process.wait(timeout=10)
                  code = 124
          print((root / (name + ".log")).read_text(errors="replace"), flush=True)
          print("RESULT:", name, code, flush=True)
          sys.exit(code)
          PY
          # Execute the C controls after LLGo, preserving a cold launch first.
          cat > "$RUNNER_TEMP/gdb-diagnostics/controls.py" <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gdb-diagnostics"
          cases = {
              "c-direct": ["set startup-with-shell off"],
              "c-shell": ["set startup-with-shell on"],
          }
          for name, settings in cases.items():
              command = ["python3", str(root / "watch.py"), name, "60", "sudo", "-n", os.environ["LLGO_GDB"], "--batch", "--nx", str(root / "control")]
              for setting in ["set trace-commands on", "set debug darwin 10", *settings, "break main", "run", "bt", "continue"]:
                  command.extend(["-ex", setting])
              # Keep every result; the two settings are controls, not retries.
              subprocess.run(command, check=False)
          PY
      - name: Build LLGo and configure native GDB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llgo-bin"
          go build -o "$RUNNER_TEMP/llgo-bin/llgo" ./cmd/llgo
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "LLGO_RAW_GDB=$LLGO_GDB" >> "$GITHUB_ENV"
          wrapper="$RUNNER_TEMP/llgo-gdb-native"
          cat > "$wrapper" <<'PY'
          #!/usr/bin/env python3
          import ctypes, os, signal, subprocess, sys
          args = sys.argv[1:]
          if "run" not in args:
              os.execv(os.environ["LLGO_RAW_GDB"], [os.environ["LLGO_RAW_GDB"], *args])
          executable = args[args.index("--batch") + 1]
          system = ctypes.CDLL("/usr/lib/libSystem.B.dylib")
          attributes = ctypes.c_void_p()
          assert system.posix_spawnattr_init(ctypes.byref(attributes)) == 0
          # Match GDB's normal Darwin launch: suspend at entry and disable ASLR.
          assert system.posix_spawnattr_setflags(ctypes.byref(attributes), 0x0180) == 0
          argv = (ctypes.c_char_p * 2)(os.fsencode(executable), None)
          values = [os.fsencode(key + "=" + value) for key, value in os.environ.items()]
          environ = (ctypes.c_char_p * (len(values) + 1))(*values, None)
          pid = ctypes.c_int()
          error = system.posix_spawn(ctypes.byref(pid), os.fsencode(executable), None, ctypes.byref(attributes), argv, environ)
          system.posix_spawnattr_destroy(ctypes.byref(attributes))
          if error:
              raise OSError(error, os.strerror(error))
          try:
              args = ["continue" if arg == "run" else arg for arg in args]
              index = args.index(executable) + 1
              args[index:index] = ["-ex", "attach " + str(pid.value), "-ex", "python import os, signal; os.kill(" + str(pid.value) + ", signal.SIGCONT)"]
              code = subprocess.call(["sudo", "-n", os.environ["LLGO_RAW_GDB"], *args])
          finally:
              try:
                  os.kill(pid.value, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              os.waitpid(pid.value, 0)
          sys.exit(code)
          PY
          chmod +x "$wrapper"
          echo "LLGO_GDB=$wrapper" >> "$GITHUB_ENV"
      - name: Run the preceding LLDB acceptance as in the actual job
        env:
          LLGO_LLDB: /usr/bin/lldb
        run: bash test/debug/runtime/runtest.sh -v
      - name: Capture actual LLGo adapter integration
        shell: bash
        env:
          LLGO_GDB_INTEGRATION: "1"
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gdb-diagnostics"
          failed = False
          for i in range(12):
              result = subprocess.run(["python3", str(root / "watch.py"), "llgo-integration-" + str(i), "150", "go", "test", "./cmd/internal/gdb", "-run", "^TestGDBIntegration$", "-count=1", "-v"])
              failed |= result.returncode != 0
          sys.exit(int(failed))
          PY
      - name: Run the C controls after the cold LLGo launches
        if: always()
        run: LLGO_GDB="$LLGO_RAW_GDB" python3 "$RUNNER_TEMP/gdb-diagnostics/controls.py"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-intel-gdb-diagnostics-${{ matrix.host }}
          path: ${{ runner.temp }}/gdb-diagnostics
          retention-days: 3
