name: Darwin detached thread recheck

on:
  push:
    branches: [codex/darwin-detach-recheck-20261015]
    paths: [.github/workflows/goroot-detach-recheck.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.repository == 'cpunion/llgo-compat-ci'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            cases: '^gcgort\.go$'
            windows_abi: ''
            windows_arch: ''
          - os: macos-15-intel
            platform: darwin/amd64
            cases: '^gcgort\.go$'
            windows_abi: ''
            windows_arch: ''
    name: Replay (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: 639f50b4bd7156796d5a22315f3af17533b45e14
      - uses: actions/checkout@v7
        with:
          path: compatibility-ci
      - uses: ./compatibility-ci/.github/actions/setup-macos-intel-llvm
        id: intel-llvm
        if: matrix.platform == 'darwin/amd64'
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          install-llvm: ${{ matrix.platform != 'darwin/amd64' }}
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          architecture: ${{ startsWith(matrix.os, 'windows') && 'x64' || '' }}
      - name: Build tools from the pinned thread fix
        shell: bash
        env:
          GOFLAGS: ${{ steps.intel-llvm.outputs.go-flags || env.GOFLAGS }}
          CGO_CPPFLAGS: ${{ steps.intel-llvm.outputs.cgo-cppflags || env.CGO_CPPFLAGS }}
          CGO_LDFLAGS: ${{ steps.intel-llvm.outputs.cgo-ldflags || env.CGO_LDFLAGS }}
        run: |
          LLGO_BUILD_GOROOT_RUNNER=1 dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "GO127_GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          llgo="$RUNNER_TEMP/llgo-bin/llgo${suffix}"
          if [[ "$RUNNER_OS" == Windows ]]; then llgo="$(cygpath -w "$llgo")"; fi
          echo "LLGO_TEST_LLGO=$llgo" >> "$GITHUB_ENV"
          echo "LLGO_GOROOT_RUNNER=$RUNNER_TEMP/llgo-bin/goroot-runner${suffix}" >> "$GITHUB_ENV"
      - name: Verify native detached thread state
        shell: bash
        run: |
          export LLGO_ROOT="$GITHUB_WORKSPACE"
          (cd runtime && "$LLGO_TEST_LLGO" test -v -timeout=2m -run '^Test(KeyNativeLayout|DetachedStateNativeValue)$' ./internal/thread)
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          architecture: ${{ startsWith(matrix.os, 'windows') && 'x64' || '' }}
          cache: false
      - name: Record Go 1.26 GOROOT
        shell: bash
        run: echo "GO126_GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        if: runner.os == 'Windows'
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}
      - name: Replay both versions without corpus changes
        shell: bash
        env:
          CASES: ${{ matrix.cases }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay"
          clang -dynamiclib -undefined dynamic_lookup \
            compatibility-ci/.github/diagnostics/thread-create-trace.c \
            -o "$RUNNER_TEMP/replay/trace.dylib"
          ulimit -a
          sysctl kern.num_taskthreads kern.num_threads kern.maxprocperuid hw.memsize || true
          printf 'timeouts: []\nflakes: []\nxfails: []\n' > "$RUNNER_TEMP/replay/empty-expectations.yaml"
          export LLGO_ROOT="$GITHUB_WORKSPACE"
          export LLGO_STDIO_NOBUF=1
          status=0
          for version in 126 127; do
            root_var="GO${version}_GOROOT"
            root="${!root_var}"
            env GOROOT="$root" PATH="$root/bin:$PATH" \
              GO111MODULE=off GOWORK=off GOTOOLCHAIN=local \
              "$LLGO_TEST_LLGO" build -o "$RUNNER_TEMP/replay/gcgort-go${version}" \
              "$root/test/gcgort.go"
            for retries in 0 20; do
              set +e
              env DYLD_INSERT_LIBRARIES="$RUNNER_TEMP/replay/trace.dylib" \
                LLGO_TRACE_CREATE_RETRIES="$retries" \
                "$RUNNER_TEMP/replay/gcgort-go${version}" \
                2>&1 | tee "$RUNNER_TEMP/replay/trace-go${version}-retries${retries}.log"
              codes=("${PIPESTATUS[@]}")
              set -e
              echo "Native execution Go${version}, retries=${retries}: ${codes[0]}"
            done
            set +e
            (
              cd test/goroot
              env GOMAXPROCS=2 XDG_CACHE_HOME="$RUNNER_TEMP/replay/cache-go${version}" \
                "$LLGO_GOROOT_RUNNER" -test.run='^TestGoRootRunCases$' \
                -test.v -test.count=5 -test.timeout=30m -goroot "$root" \
                -directive-mode ci -case "$CASES" -run-timeout 5m \
                -xfail "$RUNNER_TEMP/replay/empty-expectations.yaml" -keepwork \
                -progress 30s
            ) 2>&1 | tee "$RUNNER_TEMP/replay/go${version}.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            if [[ "${codes[0]}" != 0 ]]; then status=1; fi
          done
          exit "$status"
      - name: Preserve replay logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.os }}
          path: ${{ runner.temp }}/replay/*.log

  cleanup:
    if: github.repository == 'cpunion/llgo-compat-ci' && github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: 7396beb65122d107a25272675c7da04deee9cb85
      - uses: ./.github/actions/setup-deps
        with:
          windows-abi: msvc
          windows-arch: arm64
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          architecture: arm64
      - name: Build the unchanged compiler
        shell: bash
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: msvc
          windows-arch: arm64
      - name: Repeat the original cleanup test with coverage
        shell: bash
        run: |
          set -euo pipefail
          export LLGO_STDIO_NOBUF=1
          export LLGO_BUILD_CACHE=1
          mkdir -p "$RUNNER_TEMP/cleanup"
          cd test
          "$RUNNER_TEMP/llgo-bin/llgo.exe" test -c \
            -coverpkg=github.com/xgo-dev/llgo/test/... \
            -o "$RUNNER_TEMP/cleanup/runtime.test.exe" ./std/runtime
          "$RUNNER_TEMP/cleanup/runtime.test.exe" -test.v -test.count=50 \
            -test.timeout=10m 2>&1 | tee "$RUNNER_TEMP/cleanup/repeated.log"
          for attempt in {1..20}; do
            "$RUNNER_TEMP/cleanup/runtime.test.exe" -test.v \
              -test.run='^TestCleanupDoesNotBlockCollector$' -test.timeout=30s \
              2>&1 | tee "$RUNNER_TEMP/cleanup/fresh-${attempt}.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-arm64-cleanup
          path: ${{ runner.temp }}/cleanup/*.log
